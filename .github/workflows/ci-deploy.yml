# 검사(타입·서버 시험·화면 시험) → 통과하면 GitHub Pages 배포
name: 검사 및 배포

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5433"
      PGUSER: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: 타입 검사
        run: |
          npm run typecheck
          npx deno check supabase/functions/api/index.ts
          (cd supabase/functions/api && npx deno lint)
      - name: 구조 검사(위반 표본 포함)
        run: npm run check
      - name: 시험 DB 준비
        run: psql -q -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin;"
      - name: 서버 시험
        env: { PGHOST: localhost }
        run: |
          bash tests/local/db_reset.sh && (cd tests/server && npx deno test -A api_test.ts)
          bash tests/local/db_reset.sh && (cd tests/server && npx deno test -A config_test.ts)
          bash tests/local/db_reset.sh && (cd tests/server && npx deno test -A class_test.ts)
          bash tests/local/db_reset.sh && (cd tests/server && npx deno test -A weekly_test.ts weekly_eval_test.ts weekly_alerts_test.ts)
      - name: 옮겨 오기 시험
        env: { PGHOST: localhost }
        run: |
          (cd tools/migrate && npx deno check run.ts && npx deno lint)
          bash tests/local/db_reset.sh && (cd tests/migrate && npx deno test -A mock_users_test.ts)
          bash tests/local/db_reset.sh && (cd tests/migrate && npx deno test -A weiz2028_test.ts)
      - name: 화면 시험
        env: { PGHOST: localhost }
        run: |
          bash tests/local/db_reset.sh
          npx playwright install --with-deps chromium
          (cd tests/local && nohup npx deno run -A serve.ts > /tmp/serve.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf -X POST localhost:8000/api -H 'origin: http://localhost:5173' -d '{"action":"config"}' && break; sleep 1; done
          SHOTS_DIR=$PWD/test-results/shots npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: test-results/shots, if-no-files-found: ignore }
      - if: failure()
        run: cat /tmp/serve.log || true

  # 화면 만들기와 올리기를 다른 작업으로 나눈다(GitHub 권장 방식).
  # 한 작업 안에서 올린 직후 바로 배포하면 'github-pages 묶음을 찾지 못함'이 가끔 나서.
  build-pages:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: 빌드
        env:
          # 공개 값(브라우저 JS에 그대로 실림). w-hub Supabase 프로젝트.
          VITE_API_URL: https://bwohwhsrwasaykydjhkh.supabase.co/functions/v1/api
          VITE_SUPABASE_KEY: sb_publishable_Ci19OL6BolLQ-pmsxJsRcA_XtTlIFRb
        run: |
          npm run build
          cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: dist }

  deploy:
    needs: build-pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
